<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projelerimiz - FullPanjur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Filtre Butonları */
        .filter-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .filter-btn {
            background: transparent;
            border: 2px solid #f75b07;
            color: #fff;
            padding: 8px 20px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active-btn {
            background: #f75b07;
            color: #fff;
        }

        /* Galeri Izgarası */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(247, 91, 7, 0.3);
            background: #1a1d23;
            transition: 0.3s ease;
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .gallery-info {
            padding: 15px;
            text-align: center;
        }
        .gallery-info h3 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html"><img src="logo.png" alt="FullPanjur Logo" class="glow-logo"></a>
        <div class="menu-toggle" id="mobile-menu">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Anasayfa</a></li>
            <li><a href="hakkimizda.html">Hakkımızda</a></li>
            <li><a href="hizmetler.html">Hizmetlerimiz</a></li>
            <li><a href="galeri.html" style="color: var(--primary); font-weight: bold;">Projelerimiz</a></li>
            <li><a href="iletisim.html">İletişim</a></li>
        </ul>
    </nav>

    <!-- GALERİ BÖLÜMÜ -->
    <section class="page-content reveal active" style="padding-top: 150px;">
        <h2 style="color: var(--primary); font-size: 2.8rem; text-align: center;">PROJELERİMİZ</h2>
        
        <!-- Kategori Butonları -->
        <div class="filter-container">
            <button class="filter-btn active-btn" data-filter="hepsi">Tümü</button>
            <button class="filter-btn" data-filter="panjur">Panjur</button>
            <button class="filter-btn" data-filter="cambalkon">Cam Balkon</button>
            <button class="filter-btn" data-filter="giyotin">Giyotin</button>
            <button class="filter-btn" data-filter="makasli">Makaslı Panjur</button>
        </div>

        <!-- Resimler -->
        <div class="gallery-grid">
            
            <!-- Panjur Örneği -->
            <div class="gallery-item" data-category="panjur">
                <img src="https://via.placeholder.com/400x300?text=Panjur+Resmi+1" alt="Panjur">
                <div class="gallery-info"><h3>Otomatik Panjur</h3></div>
            </div>
            <div class="gallery-item" data-category="panjur">
                <img src="https://via.placeholder.com/400x300?text=Panjur+Resmi+2" alt="Panjur">
                <div class="gallery-info"><h3>Alüminyum Panjur</h3></div>
            </div>

            <!-- Cam Balkon Örneği -->
            <div class="gallery-item" data-category="cambalkon">
                <img src="https://via.placeholder.com/400x300?text=Cam+Balkon+1" alt="Cam Balkon">
                <div class="gallery-info"><h3>Katlanır Cam Balkon</h3></div>
            </div>

            <!-- Giyotin Örneği -->
            <div class="gallery-item" data-category="giyotin">
                <img src="https://via.placeholder.com/400x300?text=Giyotin+Cam" alt="Giyotin">
                <div class="gallery-info"><h3>Motorlu Giyotin Cam</h3></div>
            </div>

            <!-- Makaslı Panjur Örneği -->
            <div class="gallery-item" data-category="makasli">
                <img src="https://via.placeholder.com/400x300?text=Makasli+Panjur" alt="Makaslı Panjur">
                <div class="gallery-info"><h3>Dışa Açılır Makaslı Panjur</h3></div>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 FullPanjur. Tüm Hakları Saklıdır.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    
    <!-- Filtreleme Scripti -->
    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Aktif buton rengini değiştir
                filterBtns.forEach(button => button.classList.remove('active-btn'));
                btn.classList.add('active-btn');

                const filterValue = btn.getAttribute('data-filter');

                // Resimleri göster/gizle
                galleryItems.forEach(item => {
                    if (filterValue === 'hepsi' || item.getAttribute('data-category') === filterValue) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
