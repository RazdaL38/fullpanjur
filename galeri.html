<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projelerimiz - FullPanjur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Filtre Butonları */
        .filter-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .filter-btn {
            background: transparent;
            border: 2px solid #f75b07;
            color: #fff;
            padding: 10px 25px;
            margin: 5px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.4s ease;
        }
        .filter-btn:hover, .filter-btn.active-btn {
            background: #f75b07;
            color: #fff;
            box-shadow: 0 5px 15px rgba(247, 91, 7, 0.4);
            transform: translateY(-2px);
        }

        /* Galeri Izgarası & Hover Efektleri */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }
        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(247, 91, 7, 0.2);
            background: #1a1d23;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        
        /* Resim Zoom Animasyonu */
        .img-wrapper {
            overflow: hidden;
        }
        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        .gallery-item:hover {
            border-color: #f75b07;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 15px rgba(247, 91, 7, 0.3);
            transform: translateY(-8px);
        }
        .gallery-item:hover img {
            transform: scale(1.1); /* Resim hafifçe büyür */
        }
        
        /* Bilgi Kısmı */
        .gallery-info {
            padding: 20px 15px;
            text-align: center;
            background: linear-gradient(to top, #1a1d23, #23272f);
            position: relative;
            z-index: 2;
        }
        .gallery-info h3 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .gallery-info i {
            position: absolute;
            top: -20px;
            right: 20px;
            background: #f75b07;
            color: #fff;
            width: 40px;
            height: 40px;
            line-height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .gallery-item:hover .gallery-info i {
            transform: rotate(90deg);
        }

        /* Lightbox (Tam Ekran Resim) Stilleri */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.show {
            opacity: 1;
        }
        .lightbox-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(247, 91, 7, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .lightbox.show .lightbox-content {
            transform: scale(1);
        }
        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .close-lightbox:hover {
            color: #f75b07;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html"><img src="logo.png" alt="FullPanjur Logo" class="glow-logo"></a>
        <div class="menu-toggle" id="mobile-menu">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Anasayfa</a></li>
            <li><a href="hakkimizda.html">Hakkımızda</a></li>
            <li><a href="hizmetler.html">Hizmetlerimiz</a></li>
            <li><a href="galeri.html" style="color: var(--primary); font-weight: bold;">Projelerimiz</a></li>
            <li><a href="iletisim.html">İletişim</a></li>
        </ul>
    </nav>

    <!-- GALERİ BÖLÜMÜ -->
    <section class="page-content reveal active" style="padding-top: 150px;">
        <h2 style="color: var(--primary); font-size: 2.8rem; text-align: center;">PROJELERİMİZ</h2>
        
        <!-- Kategori Butonları -->
        <div class="filter-container">
            <button class="filter-btn active-btn" data-filter="hepsi">Tüm Projeler</button>
            <button class="filter-btn" data-filter="panjur">Panjur</button>
            <button class="filter-btn" data-filter="cambalkon">Cam Balkon</button>
            <button class="filter-btn" data-filter="giyotin">Giyotin</button>
            <button class="filter-btn" data-filter="kepenk">Kepenk</button>
        </div>

        <!-- Resimler -->
        <div class="gallery-grid">
            
            <div class="gallery-item" data-category="panjur">
                <div class="img-wrapper">
                    <img src="https://via.placeholder.com/600x450?text=Panjur+Resmi+1" alt="Panjur">
                </div>
                <div class="gallery-info">
                    <i class="fas fa-expand-arrows-alt"></i>
                    <h3>Otomatik Panjur Uygulaması</h3>
                </div>
            </div>

            <div class="gallery-item" data-category="cambalkon">
                <div class="img-wrapper">
                    <img src="https://via.placeholder.com/600x450?text=Cam+Balkon" alt="Cam Balkon">
                </div>
                <div class="gallery-info">
                    <i class="fas fa-expand-arrows-alt"></i>
                    <h3>Katlanır Cam Balkon</h3>
                </div>
            </div>

            <div class="gallery-item" data-category="giyotin">
                <div class="img-wrapper">
                    <img src="https://via.placeholder.com/600x450?text=Giyotin+Cam" alt="Giyotin">
                </div>
                <div class="gallery-info">
                    <i class="fas fa-expand-arrows-alt"></i>
                    <h3>Motorlu Giyotin Cam Sistemi</h3>
                </div>
            </div>

            <div class="gallery-item" data-category="kepenk">
                <div class="img-wrapper">
                    <img src="https://via.placeholder.com/600x450?text=Garaj+Kepenk" alt="Kepenk">
                </div>
                <div class="gallery-info">
                    <i class="fas fa-expand-arrows-alt"></i>
                    <h3>Alüminyum Garaj Kepengi</h3>
                </div>
            </div>

        </div>
    </section>

    <!-- LIGHTBOX (Tam Ekran Görsel Aracı) -->
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 FullPanjur. Tüm Hakları Saklıdır.</p>
        </div>
    </footer>

    <!-- SABİT WHATSAPP BUTONU -->
    <a href="https://wa.me/905495011919" class="whatsapp-float" target="_blank" title="WhatsApp ile İletişime Geçin">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
    
    <!-- Filtreleme ve Lightbox Scripti -->
    <script>
        // --- 1. Filtreleme İşlemi ---
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(button => button.classList.remove('active-btn'));
                btn.classList.add('active-btn');

                const filterValue = btn.getAttribute('data-filter');

                galleryItems.forEach(item => {
                    item.style.transform = 'scale(0.8)';
                    item.style.opacity = '0';
                    
                    setTimeout(() => {
                        if (filterValue === 'hepsi' || item.getAttribute('data-category') === filterValue) {
                            item.style.display = 'block';
                            setTimeout(() => {
                                item.style.transform = 'scale(1)';
                                item.style.opacity = '1';
                            }, 50);
                        } else {
                            item.style.display = 'none';
                        }
                    }, 300);
                });
            });
        });

        // --- 2. Lightbox (Tam Ekran Yapma) İşlemi ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.querySelector('.close-lightbox');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const imgSrc = item.querySelector('img').getAttribute('src');
                lightbox.style.display = 'block';
                setTimeout(() => lightbox.classList.add('show'), 10);
                lightboxImg.src = imgSrc;
            });
        });

        // Çarpıya veya boşluğa basınca kapat
        const closeLightbox = () => {
            lightbox.classList.remove('show');
            setTimeout(() => lightbox.style.display = 'none', 300);
        };

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) closeLightbox();
        });
    </script>
</body>
</html>
